# Benchmark registry for contamination detection.
#
# Local copies only: DataForge never downloads benchmark material. Entries marked
# `required: false` are skipped (and reported as "not available locally") until an
# operator fetches the data under its license; see each directory's README.
version: 1
base_dir: .
benchmarks:
  demo_math:
    path: custom/demo_math.jsonl
    fields: [question]
    id_field: id
    license: CC0-1.0
    description: Synthetic arithmetic word problems generated by dataforge.synthetic.benchmarks.
  demo_code:
    path: custom/demo_code.jsonl
    fields: [prompt, canonical_solution]
    id_field: id
    license: CC0-1.0
    description: Synthetic Python function-completion tasks generated by dataforge.synthetic.benchmarks.
  gsm8k:
    path: gsm8k/test.jsonl
    fields: [question]
    id_field: null
    license: MIT
    source_url: https://github.com/openai/grade-school-math
    required: false
    description: Grade-school math test split (fetch manually; see gsm8k/README.md).
  humaneval:
    path: humaneval/HumanEval.jsonl
    fields: [prompt, canonical_solution]
    id_field: task_id
    license: MIT
    source_url: https://github.com/openai/human-eval
    required: false
    description: Python code-generation problems (fetch manually; see humaneval/README.md).
  mbpp:
    path: mbpp/mbpp.jsonl
    fields: [text, code]
    id_field: task_id
    license: CC-BY-4.0
    source_url: https://github.com/google-research/google-research/tree/master/mbpp
    required: false
    description: Mostly Basic Python Problems (fetch manually; see mbpp/README.md).
